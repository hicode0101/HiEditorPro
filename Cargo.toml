[workspace]
resolver = "2"
members = [
    "crates/hieditor-core",
    "crates/hieditor-search",
    "crates/hieditor-cli",
    "crates/hieditor-gui",
    "crates/hieditor-menu",
    "crates/hieditor-bench",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
memmap2 = "0.9"
encoding_rs = "0.8"
memchr = "2.7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
criterion = "0.5"
eframe = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
