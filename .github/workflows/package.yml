# HiEditor Pro 自动编译打包发布
# - push v* 标签（如 v1.0.0）：以 tag 为版本号源头——自动把根 Cargo.toml 的 version
#   同步为 tag 版本（程序"关于"里的版本号取自编译期 CARGO_PKG_VERSION，随之一致），
#   打包 HiEditorPro-v{tag版本}.zip 并自动发布到 GitHub Release
# - 手动触发（workflow_dispatch）：按 Cargo.toml 版本编译打包，上传 Artifacts
# 产物：HiEditorPro-v{版本}.zip，内含 HiEditorPro.exe / README.md / hieditor_menu.dll
#       与 sparse\ 稀疏包注册文件（AppxManifest.xml + 图标 + 签名 msix/.cer）；
#       注册走 HiEditorPro --register 或 GUI 设置（签名包免开发者模式，证书导入弹一次 UAC）

name: Package

on:
  push:
    #branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write   # 打标签时创建 Release 需要

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本号以 tag 为准：有 v* tag 用 tag 版本，手动触发无 tag 时回落到 Cargo.toml
      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          $cargoVer = (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line -replace '[^0-9.]', ''
          $tag = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $tag = $env:GITHUB_REF_NAME -replace '^v', '' }
          if ($tag) {
            "tag=$tag" >> $env:GITHUB_OUTPUT
            "version=$tag" >> $env:GITHUB_OUTPUT
            "版本来源: tag v$tag"
          } else {
            "tag=" >> $env:GITHUB_OUTPUT
            "version=$cargoVer" >> $env:GITHUB_OUTPUT
            "版本来源: Cargo.toml v$cargoVer"
          }

      # 仅 tag 触发：把根 Cargo.toml 的 workspace version 改成 tag 版本，
      # 使代码内版本号与 tag 一致（成员 crate 均为 version.workspace = true，无需改动；
      # Cargo.lock 的本地包版本会在 cargo build 时自动更新）
      - name: 同步版本号到代码
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.ver.outputs.tag }}'
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]*"', ('version = "' + $tag + '"') | Set-Content Cargo.toml -NoNewline
          Select-String -Path Cargo.toml -Pattern '^version' | ForEach-Object { "已同步: $($_.Line.Trim())" }

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      # 编译产物所需的两个包：hieditor-gui（HiEditorPro.exe）+ hieditor-menu（hieditor_menu.dll，
      # 运行时加载的 cdylib，不是 gui 的依赖，必须单独 -p）
      - name: 编译 release
        run: cargo build --release -p hieditor-gui -p hieditor-menu

      # 签名证书：pfx 随仓库分发；若配置了仓库 Secret SIGNING_PFX（pfx 的 Base64）则覆盖注入，
      # 本地与 CI 用同一张证书，版本间不变；更换证书 = 重跑 signing\reset-signing-cert.ps1 后提交新 pfx
      - name: 还原固定签名证书
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
        shell: pwsh
        run: |
          if ($env:SIGNING_PFX) { [IO.File]::WriteAllBytes('signing/hieditor-signing.pfx', [Convert]::FromBase64String($env:SIGNING_PFX)) }
          if (-not (Test-Path 'signing/hieditor-signing.pfx')) { throw '缺少 signing/hieditor-signing.pfx（仓库中没有，也未提供 Secret SIGNING_PFX）' }
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2('signing/hieditor-signing.pfx', 'hieditor-signing')
          "已还原固定证书: $($cert.Thumbprint)（有效至 $($cert.NotAfter)）"

      # 复刻 package.bat：暂存目录 → exe/README/dll + sparse 清单与图标 → 签名 msix → 压缩 zip
      # 与 package.bat 的差异：签名失败此处直接失败——CI 宁可阻断发布，也不无声发布
      # 需要开发者模式的未签名降级包
      - name: 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target/release/HiEditorPro.exe'
          $dll = 'target/release/hieditor_menu.dll'
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }
          if (-not (Test-Path $dll)) { throw "未找到 $dll" }
          $dist = "HiEditorPro-v${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "dist/$dist/sparse/assets" | Out-Null
          Copy-Item $exe "dist/$dist/"
          Copy-Item README.md "dist/$dist/"
          Copy-Item $dll "dist/$dist/"
          Copy-Item sparse/AppxManifest.xml "dist/$dist/sparse/"
          Copy-Item sparse/assets/Square150x150Logo.png, sparse/assets/Square44x44Logo.png "dist/$dist/sparse/assets/"
          # 签名稀疏包：makeappx 只打清单与图标，exe/dll 经 -ExternalLocation 外挂，不进包
          pwsh -NoProfile -ExecutionPolicy Bypass -File signing/build-msix.ps1 `
            -ManifestDir "dist/$dist/sparse" `
            -OutMsix "dist/$dist/sparse/HiEditorProContextMenu.msix" `
            -CertOut "dist/$dist/sparse/HiEditorPro.cer"
          if ($LASTEXITCODE -ne 0) { throw "签名稀疏包构建失败（缺 Windows SDK 的 makeappx/signtool 或签名证书）" }
          Compress-Archive -Path "dist/$dist/*" -DestinationPath "dist/$dist.zip" -Force
          Get-Item "dist/$dist.zip" | ForEach-Object { "产物: $($_.Name) ($($_.Length) 字节)" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HiEditorPro-v${{ steps.ver.outputs.version }}
          path: dist/HiEditorPro-v*.zip
          if-no-files-found: error

      # 仅 v* 标签触发：自动创建 Release 并附上 zip（generate_release_notes 自动生成更新说明）
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HiEditorPro-v*.zip
          generate_release_notes: true
