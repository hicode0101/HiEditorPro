# HiEditor Pro 自动编译打包（对齐 package.bat 流程）
# - push 到 main / 手动触发：编译并上传构建产物（Artifacts）
# - push v* 标签（如 v1.0.0）：额外创建 GitHub Release 并附上 zip
# 产物：HiEditorPro-v{版本}.zip，内含 hieditor-pro.exe（由 hieditor-gui.exe 改名）
# 版本号自动从根 Cargo.toml 读取，无需在此维护

name: Package

on:
  push:
    #branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write   # 打标签时创建 Release 需要

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      # package.bat 前提步骤：编译 release（只编译 GUI 及其依赖，速度更快）
      - name: 编译 release
        run: cargo build --release -p hieditor-gui

      # 从根 Cargo.toml 提取版本号（与 release.bat/package.bat 的提取逻辑一致）
      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line -replace '[^0-9.]', ''
          "version=$v" >> $env:GITHUB_OUTPUT
          "使用版本: $v"

      # 复刻 package.bat：准备暂存目录 → hieditor-gui.exe 改名 hieditor-pro.exe → 压缩 zip
      - name: 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gui = 'target/release/hieditor-gui.exe'
          if (-not (Test-Path $gui)) { throw "未找到 $gui" }
          $dist = "HiEditorPro-v${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "dist/$dist" | Out-Null
          Copy-Item $gui "dist/$dist/hieditor-pro.exe"
          Compress-Archive -Path "dist/$dist/*" -DestinationPath "dist/$dist.zip" -Force
          Get-Item "dist/$dist.zip" | ForEach-Object { "产物: $($_.Name) ($($_.Length) 字节)" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: HiEditorPro-v${{ steps.ver.outputs.version }}
          path: dist/HiEditorPro-v*.zip
          if-no-files-found: error

      # 仅 v* 标签触发：创建 GitHub Release 并附上 zip
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HiEditorPro-v*.zip
