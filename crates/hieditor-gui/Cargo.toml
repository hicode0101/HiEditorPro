[package]
name = "hieditor-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hieditor-gui"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
hieditor-core = { path = "../hieditor-core" }
hieditor-search = { path = "../hieditor-search" }
memchr = "2.7"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
rfd = "0.15"
sys-locale = "0.3"
eframe = { workspace = true }
